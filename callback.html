<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация...</title>
    <style>
        body { background: #0a0a1a; color: #00e5ff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    </style>
</head>
<body>
    <h2>⏳ Вход в Галактику...</h2>

    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');

            if (!code) {
                document.body.innerHTML = '<h2 style="color:red;">❌ Код авторизации не найден</h2>';
                return;
            }

            try {
                const API_URL = 'https://my-shop-server-e0hc.onrender.com';
                const response = await fetch(`${API_URL}/api/auth/discord/callback?code=${code}`);
                const data = await response.json();

                if (data.token) {
                    localStorage.setItem('token', data.token);
                    // Перенаправляем на главную страницу
                    window.location.href = '/';
                } else {
                    document.body.innerHTML = `<h2 style="color:red;">❌ Ошибка сервера: ${data.error || 'Неизвестно'}</h2>`;
                }
            } catch (error) {
                document.body.innerHTML = '<h2 style="color:red;">❌ Ошибка соединения с сервером</h2>';
            }
        })();
    </script>
</body>
</html>
