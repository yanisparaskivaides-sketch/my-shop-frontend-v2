<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Админ-панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0ff; font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(10, 10, 30, 0.6); padding: 35px; border-radius: 30px; border: 1px solid rgba(200, 0, 255, 0.25); }
        h2 { text-align: center; background: linear-gradient(135deg, #e040fb, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; }
        button.add { width: 100%; padding: 15px; background: linear-gradient(135deg, #e040fb, #7c4dff); border: none; color: #fff; border-radius: 30px; cursor: pointer; margin-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); margin: 5px 0; border-radius: 8px; }
        .btn-del { background: transparent; border: 1px solid #ff1744; color: #ff1744; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛸 АДМИН-ПАНЕЛЬ</h2>
        <input type="text" id="name" placeholder="Название">
        <input type="number" id="price" placeholder="Цена (монет)">
        <input type="text" id="image" placeholder="Ссылка на картинку">
        <textarea id="desc" placeholder="Описание"></textarea>
        <button class="add" onclick="addProduct()">Добавить товар</button>
        <div id="list" style="margin-top:20px;"></div>
    </div>
    <script>
        const API_URL = 'https://my-shop-server-e0hc.onrender.com';
        async function load() {
            const res = await fetch(`${API_URL}/api/products`);
            const items = await res.json();
            document.getElementById('list').innerHTML = items.map(p => `
                <div class="item">
                    <span><b>${p.name}</b> - ${p.price} монет</span>
                    <button class="btn-del" onclick="delProduct(${p.id})">Удалить</button>
                </div>
            `).join('');
        }
        load();
        async function addProduct() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            if(!name || !price) return alert('Введите название и цену!');
            await fetch(`${API_URL}/api/admin/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name, 
                    price: Number(price), 
                    image_url: document.getElementById('image').value, 
                    description: document.getElementById('desc').value 
                })
            });
            load();
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('image').value = '';
            document.getElementById('desc').value = '';
        }
        async function delProduct(id) {
            if(confirm('Удалить товар?')) {
                await fetch(`${API_URL}/api/admin/products/${id}`, { method: 'DELETE' });
                load();
            }
        }
    </script>
</body>
</html>
