<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Галактический магазин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 10% 20%, rgba(100, 0, 255, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(0, 200, 255, 0.1) 0%, transparent 40%);
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(120, 0, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 0, 255, 0.2);
            padding: 15px 30px; border-radius: 20px; margin-bottom: 30px;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #b388ff; box-shadow: 0 0 15px rgba(179, 136, 255, 0.5); }
        .login-btn {
            background: linear-gradient(135deg, #b388ff, #7c4dff);
            color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 30px;
            font-weight: bold; transition: all 0.3s;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.4); border: 1px solid rgba(255,255,255,0.1);
        }
        .login-btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(124, 77, 255, 0.7); }
        .balance { font-weight: bold; font-size: 20px; color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        #status { text-align: center; font-size: 18px; color: #8888aa; margin-bottom: 25px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card {
            background: rgba(15, 15, 35, 0.7); backdrop-filter: blur(8px);
            border: 1px solid rgba(150, 0, 255, 0.25);
            box-shadow: 0 0 20px rgba(100, 0, 255, 0.15), inset 0 0 40px rgba(255,255,255,0.02);
            padding: 25px 20px; border-radius: 20px; text-align: center; transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-8px) scale(1.02); border-color: #b388ff; box-shadow: 0 0 40px rgba(179, 136, 255, 0.4); }
        .card h3 { font-size: 22px; margin-bottom: 8px; color: #ffffff; }
        .card img { max-width: 100%; height: 180px; object-fit: contain; margin: 10px 0; border-radius: 12px; }
        .price { font-size: 24px; color: #00e5ff; font-weight: bold; margin: 12px 0; text-shadow: 0 0 10px rgba(0, 229, 255, 0.3); }
        .card p { color: #aaaacc; font-size: 14px; margin-bottom: 15px; }
        .btn {
            background: transparent; color: #b388ff; border: 2px solid #b388ff;
            padding: 12px 0; border-radius: 30px; cursor: pointer; width: 100%;
            font-size: 16px; font-weight: bold; transition: all 0.3s;
            box-shadow: 0 0 10px rgba(179, 136, 255, 0.2);
        }
        .btn:hover { background: #b388ff; color: #0a0a1a; box-shadow: 0 0 30px rgba(179, 136, 255, 0.6); }
        #userInfo { display: flex; align-items: center; gap: 12px; }
        #userInfo strong { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🌌 ГАЛАКТИКА</h1>
                <div id="userInfo"></div>
            </div>
            <div id="loginBlock">
                <a href="#" class="login-btn" id="loginBtn">🔮 Войти через Discord</a>
            </div>
        </div>

        <div id="status">Загрузка товаров...</div>
        <div class="products" id="productList"></div>
    </div>

    <script>
        const API_URL = 'https://my-shop-server-e0hc.onrender.com';
        const FRONTEND_URL = 'https://my-shop-frontend-v2.onrender.com';

        let currentUser = null;

        async function loadProducts() {
            const response = await fetch(`${API_URL}/api/products`);
            const products = await response.json();
            document.getElementById('status').innerText = products.length > 0 ? '' : 'Товаров пока нет';
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} монет</div>
                    ${p.image_url ? `<img src="${p.image_url}">` : ''}
                    <p>${p.description || ''}</p>
                    <button class="btn" onclick="buyProduct(${p.id}, '${p.name}', ${p.price})">Купить</button>
                `;
                list.appendChild(card);
            });
        }

        async function buyProduct(id, name, price) {
            if (!currentUser) return alert('Сначала войдите через Discord!');
            if (currentUser.balance < price) return alert(`Не хватает монет! У вас ${currentUser.balance}, нужно ${price}.`);
            if (confirm(`Купить "${name}" за ${price} монет?`)) {
                alert('✅ Покупка совершена!');
                location.reload();
            }
        }

        async function checkUser() {
            const token = localStorage.getItem('token');

            if (token) {
                try {
                    const response = await fetch(`${API_URL}/api/user/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        currentUser = await response.json();
                        renderUser(currentUser);
                        return;
                    }
                } catch (e) {}
                localStorage.removeItem('token');
            }
            showLoginButton();
        }

        function renderUser(user) {
            const loginBlock = document.getElementById('loginBlock');
            const userInfo = document.getElementById('userInfo');
            loginBlock.innerHTML = `<div class="balance">💰 Баланс: ${user.balance} монет</div>`;
            userInfo.innerHTML = `
                ${user.avatar_url ? `<img src="${user.avatar_url}" class="avatar">` : ''}
                <strong>${user.name}</strong>
            `;
            document.getElementById('userInfo').style.display = 'flex';
        }

        async function showLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            const DISCORD_CLIENT_ID = '1529148109702041610';
            const redirectUri = `${FRONTEND_URL}/auth/discord/callback`;
            const discordUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=identify`;
            loginBtn.href = discordUrl;
        }

        // === ЭТОТ КОД ПЕРЕХВАТЫВАЕТ АВТОРИЗАЦИЮ ===
        window.onload = () => {
            // Проверяем, вернулись ли мы от Discord
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (code) {
                // Если есть код, перенаправляем на сервер для обработки
                window.location.href = `https://my-shop-server-e0hc.onrender.com/api/auth/discord/callback?code=${code}`;
            } else if (error) {
                alert('❌ Ошибка авторизации в Discord');
            } else {
                // Если мы на главной странице, загружаем магазин
                loadProducts();
                checkUser();
            }
        };
    </script>
</body>
</html>
