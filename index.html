<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Галактический магазин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a; color: #e0e0ff; font-family: sans-serif; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 30, 0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(120, 0, 255, 0.4); padding: 15px 30px; border-radius: 20px; margin-bottom: 30px;
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #b388ff; }
        .profile-info { display: flex; align-items: center; gap: 15px; }
        .user-name { color: #fff; font-size: 18px; font-weight: bold; }
        .user-balance { color: #00e5ff; font-size: 20px; font-weight: bold; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .login-btn {
            background: linear-gradient(135deg, #b388ff, #7c4dff); color: #fff; border: none;
            padding: 12px 28px; border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.4);
        }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card {
            background: rgba(15, 15, 35, 0.8); border: 1px solid rgba(150, 0, 255, 0.3);
            padding: 25px; border-radius: 20px; text-align: center;
        }
        .card img { max-width: 100%; height: 150px; object-fit: contain; margin: 10px 0; }
        .price { font-size: 22px; color: #00e5ff; font-weight: bold; margin: 10px 0; }
        .btn {
            background: transparent; color: #b388ff; border: 2px solid #b388ff;
            padding: 10px 0; border-radius: 30px; cursor: pointer; width: 100%;
        }
        .btn:hover { background: #b388ff; color: #0a0a1a; }
        #userInfo { display: none; align-items: center; gap: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🌌 ГАЛАКТИКА</h1>
                <div id="userInfo" class="profile-info">
                    <span id="userAvatar"></span>
                    <div>
                        <div class="user-name" id="userName">Загрузка...</div>
                        <div class="user-balance" id="userBalance">💰 Баланс: 0 монет</div>
                    </div>
                </div>
            </div>
            <div id="loginBlock">
                <button class="login-btn" id="loginBtn">🔮 Войти через Discord</button>
            </div>
        </div>

        <div id="status" style="text-align:center; color:#888; margin-bottom:20px;">Загрузка товаров...</div>
        <div class="products" id="productList"></div>
    </div>

    <script>
        const API_URL = 'https://my-shop-server-e0hc.onrender.com';
        const FRONTEND_URL = 'https://my-shop-frontend-v2.onrender.com';

        let currentUser = null;

        async function loadProducts() {
            const response = await fetch(`${API_URL}/api/products`);
            const products = await response.json();
            document.getElementById('status').innerText = products.length > 0 ? '' : 'Товаров пока нет';
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} монет</div>
                    ${p.image_url ? `<img src="${p.image_url}">` : ''}
                    <button class="btn" onclick="buyProduct(${p.id}, ${p.price})">Купить</button>
                `;
                list.appendChild(card);
            });
        }

        async function buyProduct(id, price) {
            if (!currentUser) return alert('Сначала войдите через Discord!');
            if (currentUser.balance < price) return alert(`Не хватает монет! У вас ${currentUser.balance}, нужно ${price}.`);
            alert('✅ Покупка совершена!');
        }

        async function handleAuth() {
            const token = localStorage.getItem('token');

            if (token) {
                try {
                    const response = await fetch(`${API_URL}/api/user/me`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        currentUser = await response.json();
                        showUserCabinet(currentUser);
                        return;
                    }
                } catch (e) {}
                localStorage.removeItem('token');
            }
            showLoginButton();
        }

        function showUserCabinet(user) {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userBalance').innerText = `💰 Баланс: ${user.balance} монет`;
            if (user.avatar_url) {
                document.getElementById('userAvatar').innerHTML = `<img src="${user.avatar_url}" class="avatar">`;
            }
        }

        async function showLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            const DISCORD_CLIENT_ID = '1529148109702041610';
            // ВАЖНО: Теперь ссылка ведёт на файл callback.html!
            const redirectUri = `${FRONTEND_URL}/callback.html`;
            const discordUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=identify`;
            loginBtn.onclick = () => { window.location.href = discordUrl; };
        }

        window.onload = () => {
            loadProducts();
            handleAuth();
        };
    </script>
</body>
</html>
