<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Галактический магазин</title>
    <style>
        body { background: #0a0a1a; color: #e0e0ff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 32px; margin-bottom: 30px; background: linear-gradient(135deg, #b388ff, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .card { background: rgba(15, 15, 35, 0.8); border: 1px solid rgba(150, 0, 255, 0.3); padding: 20px; border-radius: 20px; text-align: center; }
        .price { color: #00e5ff; font-size: 22px; font-weight: bold; }
        .btn { background: transparent; color: #b388ff; border: 2px solid #b388ff; padding: 10px 20px; border-radius: 30px; cursor: pointer; }
        .btn:hover { background: #b388ff; color: #0a0a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌌 ГАЛАКТИКА</h1>
        <div id="status" style="text-align:center; margin-bottom:20px; color:#888;">Загрузка товаров...</div>
        <div class="products" id="productList"></div>
    </div>
    <script>
        const API_URL = 'https://my-shop-server-e0hc.onrender.com';
        async function loadProducts() {
            const res = await fetch(`${API_URL}/api/products`);
            const products = await res.json();
            document.getElementById('status').innerText = products.length > 0 ? '' : 'Товаров пока нет';
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} монет</div>
                    ${p.image_url ? `<img src="${p.image_url}" style="max-width:100%; height:150px; object-fit:contain;">` : ''}
                    <button class="btn" onclick="alert('Для покупки напиши в Discord: /buy ${p.name}')">Купить</button>
                `;
                list.appendChild(card);
            });
        }
        loadProducts();
    </script>
</body>
</html>
